name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

env:
  MIX_ENV: test
  # Runtime versions (Erlang, Elixir, Node) are read from `.tool-versions`
  # so local asdf and CI stay in lockstep. Postgres isn't an asdf runtime,
  # so it's pinned here — the one place CI needs it.
  POSTGRES_IMAGE: postgres:16-alpine

jobs:
  build:
    name: Compile · lint · test · dialyzer
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ${{ env.POSTGRES_IMAGE }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: web_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Actions are pinned to commit SHAs (GitHub's supply-chain
      # recommendation). The trailing comment is the human-readable tag;
      # let Dependabot bump both together.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache deps and _build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache dialyzer PLTs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-

      - name: Install Elixir deps
        run: mix deps.get

      - name: Install JS deps
        run: npm ci
        working-directory: assets

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      - name: Lint (credo + biome)
        run: mix lint

      - name: i18n check
        run: mix i18n.check

      - name: Test
        run: mix test

      - name: Dialyzer
        run: mix dialyzer
